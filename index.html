<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SecureTrack</title>
</head>

<body>

  <script>
    (() => {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const asset =
        params.get("asset");


      // ==========================================
      // QR / NFC DEVICE SCAN
      // ==========================================

      if (asset) {

        window.location.replace(
          "device.html?asset=" +
          encodeURIComponent(asset)
        );

        return;
      }


      // ==========================================
      // NORMAL SECURETRACK ENTRY
      // ==========================================

      window.location.replace(
        "login.html"
      );

    })();
  </script>

</body>
</html>
