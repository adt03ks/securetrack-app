<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SecureTrack</title>
  
<!-- ============================================ -->
<!-- SECURETRACK OP - HOME SCREEN APP ICONS       -->
<!-- ============================================ -->

<!-- Standard browser icon -->
<link rel="icon"
      type="image/png"
      href="/assets/favicon.png?v=2">

<!-- Apple iPhone and iPad Home Screen icon -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png?v=2">

<!-- Android / PWA manifest -->
<link rel="manifest"
      href="/manifest.webmanifest?v=2">

<!-- Application appearance -->
<meta name="theme-color"
      content="#111827">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="SecureTrack OP">

<meta name="application-name"
      content="SecureTrack OP">


<link rel="stylesheet" href="/footer.css">
 <!-- Browser favicon -->
  
</head>

<body>

  <script>
    (() => {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const asset =
        params.get("asset");


      // ==========================================
      // QR / NFC DEVICE SCAN
      // ==========================================

      if (asset) {

        window.location.replace(
          "device.html?asset=" +
          encodeURIComponent(asset)
        );

        return;
      }


      // ==========================================
      // NORMAL SECURETRACK ENTRY
      // ==========================================

      window.location.replace(
        "login.html"
      );

    })();
  </script>

<!-- SECURETRACK LOGIN FOOTER -->
<div id="securetrack-footer"
     data-variant="login"></div>

<script src="/footer.js" defer></script>
  
</body>
</html>
