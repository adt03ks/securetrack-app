<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SecureTrack</title>
  
  <link rel="icon" 
    type="image/png" 
    href="/assets/favicon.png"> 

<link rel="icon"
      href="/favicon.ico"
      sizes="any">

<link rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png">

<!-- iPhone / iPad home screen -->
<link rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png">

<!-- Android / PWA -->
<link rel="manifest"
      href="/site.webmanifest">

<!-- Mobile appearance -->
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"> 

<link rel="stylesheet" href="/footer.css">
 <!-- Browser favicon -->
  
</head>

<body>

  <script>
    (() => {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const asset =
        params.get("asset");


      // ==========================================
      // QR / NFC DEVICE SCAN
      // ==========================================

      if (asset) {

        window.location.replace(
          "device.html?asset=" +
          encodeURIComponent(asset)
        );

        return;
      }


      // ==========================================
      // NORMAL SECURETRACK ENTRY
      // ==========================================

      window.location.replace(
        "login.html"
      );

    })();
  </script>

<!-- SECURETRACK LOGIN FOOTER -->
<div id="securetrack-footer"
     data-variant="login"></div>

<script src="/footer.js" defer></script>
  
</body>
</html>
