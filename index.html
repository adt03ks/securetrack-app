<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>SecureTrack</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png"> 
<link rel="stylesheet" href="/footer.css">
  
</head>

<body>

  <script>
    (() => {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const asset =
        params.get("asset");


      // ==========================================
      // QR / NFC DEVICE SCAN
      // ==========================================

      if (asset) {

        window.location.replace(
          "device.html?asset=" +
          encodeURIComponent(asset)
        );

        return;
      }


      // ==========================================
      // NORMAL SECURETRACK ENTRY
      // ==========================================

      window.location.replace(
        "login.html"
      );

    })();
  </script>

<!-- SECURETRACK LOGIN FOOTER -->
<div id="securetrack-footer"
     data-variant="login"></div>

<script src="/footer.js" defer></script>
  
</body>
</html>
