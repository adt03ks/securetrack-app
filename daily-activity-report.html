<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0b0d10"
  >

  <title>
    SecureTrack | Daily Activity Report
  </title>

</head>


<body
  data-securetrack-roles="team_lead,senior_officer,manager,director,admin"
>

  <main>

    <header>

      <div>
        SECURETRACK SECURITY OPERATIONS
      </div>

      <h1>
        Daily Activity & Shift Accountability Report
      </h1>

      <p>
        Live operational record for the active security shift.
      </p>

    </header>


    <section>

      <h2>
        Shift Command Summary
      </h2>


      <div>

        <strong>
          Shift
        </strong>

        <span id="shiftName">
          Loading…
        </span>

      </div>


      <div>

        <strong>
          Shift Date
        </strong>

        <span id="shiftDate">
          Loading…
        </span>

      </div>


      <div>

        <strong>
          Shift Instance
        </strong>

        <span id="shiftInstanceId">
          Loading…
        </span>

      </div>

    </section>


    <div>

      <a
        id="returnToAssignments"
        href="#"
      >
        ← Return to Duty Assignments
      </a>

    </div>

  </main>


  <script
    src="daily-activity-report.js"
  ></script>

</body>

</html>
